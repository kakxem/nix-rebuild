name: check

on:
  push:
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Flake checks
        run: nix flake check -L
      - name: Clippy
        run: nix develop -c bash -c 'cd rust && cargo clippy --all-targets -- -D warnings'
